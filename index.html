<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>해시태그형만봐</title>
<style>
  :root{
    --blue:#0095f6;
    --border:#dbdbdb;
    --gray-text:#8e8e8e;
    --bg:#fafafa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:#fff;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    min-height:100vh;
  }

  /* ---- app container (프레임 없이 화면 전체 사용) ---- */
  .phone{
    width:100%;
    max-width:520px;
    margin:0 auto;
    height:100vh;
    background:#fff;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---- screens ---- */
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    background:#fff;
  }

  /* header */
  .topbar{
    height:52px;
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid var(--border);
  }
  .topbar .username{
    font-size:19px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
  }

  /* profile section */
  .profile-wrap{ padding:18px 16px 0 16px; }
  .profile-top{
    display:flex;
    align-items:center;
    gap:22px;
  }
  .avatar-ring{
    width:88px; height:88px;
    border-radius:50%;
    padding:3px;
    flex-shrink:0;
    cursor:pointer;
    background:transparent; /* 내 스토리가 있으면 JS가 그라데이션으로 바꿔줌 */
    position:relative;
  }
  .avatar-ring.has-story{
    background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
  }

  .avatar{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #fff;
    background:#eee;
    display:block;
  }
  .stats{
    flex:1;
    display:flex;
    justify-content:space-around;
  }
  .stat{ text-align:center; }
  .stat b{ display:block; font-size:16px; }
  .stat span{ font-size:12.5px; color:#111; }

  .name-bio{ margin-top:12px; }
  .name-bio .fullname{ font-weight:600; font-size:13.5px; }
  .name-bio .bio{ font-size:13.5px; margin-top:2px; white-space:pre-wrap; color:#111; line-height:1.35;}
  .name-bio .story-hint{ font-size:11.5px; color:var(--gray-text); margin-top:6px; }

  .tabbar{
    display:flex;
    border-top:1px solid var(--border);
    margin-top:14px;
  }
  .tabbar button{
    flex:1;
    padding:10px 0 8px 0;
    background:none;
    border:none;
    border-top:1.5px solid transparent;
    cursor:pointer;
    color:var(--gray-text);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tabbar button.active{
    color:#111;
    border-top-color:#111;
  }

  /* grid */
  .grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:2px;
    background:#fff;
    padding:2px 0 0 0;
    overflow:hidden;
  }
  .cell{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    background:#e8e8e8;
  }
  .cell img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .cell .yt-badge{
    position:absolute;
    top:6px; right:6px;
    color:#fff;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
  }
  .cell .multi-badge{
    position:absolute;
    top:7px; right:7px;
    color:#fff;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.6));
  }
  .cell.empty{
    background:#fff;
  }

  /* 두 번째 탭(유튜브) 전용 레이아웃: 정사각형 대신 16:9 영상 비율 */
  .grid.video-mode{
    grid-template-columns:1fr;
    grid-template-rows:none;
    grid-auto-rows:min-content;
    overflow-y:auto;
    gap:14px;
    padding:12px;
  }
  .grid.video-mode .cell{
    aspect-ratio:16/9;
    border-radius:10px;
  }
  .grid.video-mode .cell-wrap{
    display:flex;
    flex-direction:column;
    cursor:pointer;
  }

  /* modal / sub-screens sliding in */
  .subscreen{
    position:absolute;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .28s ease;
    z-index:30;
  }
  .subscreen.open{ transform:translateX(0); }
  .subscreen .topbar{}
  .subscreen .topbar .title{
    font-size:16px; font-weight:700;
  }

  /* post detail */
  .post-detail-body{ flex:1; overflow-y:auto; }
  .pd-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
  }
  .pd-header img{
    width:32px; height:32px;
    border-radius:50%;
    object-fit:cover;
  }
  .pd-header .u{ font-size:13.5px; font-weight:600; flex:1; }
  .pd-media{
    width:100%;
    aspect-ratio:1/1;
    background:#000;
    position:relative;
  }
  .pd-media.video-ratio{
    aspect-ratio:16/9;
  }
  .pd-media img, .pd-media iframe{
    width:100%; height:100%;
    object-fit:cover;
    border:none;
    display:block;
  }
  .pd-swipe-track{
    display:flex;
    width:100%; height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .pd-swipe-track::-webkit-scrollbar{ display:none; }
  .pd-swipe-track img{
    flex:0 0 100%;
    width:100%; height:100%;
    object-fit:cover;
    scroll-snap-align:start;
  }
  .pd-swipe-counter{
    position:absolute;
    top:10px; right:10px;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:11.5px;
    padding:3px 9px;
    border-radius:12px;
    z-index:2;
  }
  .pd-swipe-dots{
    position:absolute;
    bottom:10px; left:0; right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:2;
  }
  .pd-swipe-dots span{
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
  }
  .pd-swipe-dots span.active{
    background:#fff;
  }
  .pd-actions{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 12px 4px 12px;
  }
  .pd-actions svg{ cursor:pointer; }
  .pd-actions svg#pdLikeBtn.liked{
    stroke:#ed4956;
    fill:#ed4956;
  }
  .pd-likes{
    padding:0 12px;
    font-size:13.5px;
    font-weight:600;
  }
  .pd-caption{
    padding:6px 12px 20px 12px;
    font-size:13.5px;
    line-height:1.4;
  }
  .pd-caption b{ margin-right:6px; }

  /* comments */
  .pd-comments-header{
    padding:2px 12px 8px 12px;
    font-size:12.5px;
    color:var(--gray-text);
    font-weight:600;
  }
  .pd-comments{
    padding:0 12px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .pd-comment-empty{
    font-size:13px;
    color:var(--gray-text);
    padding:4px 0;
  }
  .pd-comment{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }
  .pd-comment-text{
    font-size:13.5px;
    line-height:1.4;
    word-break:break-word;
  }
  .pd-comment-text b{ margin-right:6px; }
  .pd-comment-del{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--gray-text);
    font-size:11.5px;
    cursor:pointer;
    padding:2px 4px;
  }
  .pd-comment-del:hover{ color:#ed4956; }
  .pd-comment-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-top:1px solid var(--border);
  }
  .pd-comment-name-input{
    width:64px;
    flex-shrink:0;
    border:none;
    outline:none;
    font-size:13px;
    padding:8px 0;
  }
  .pd-comment-text-input{
    flex:1;
    border:none;
    outline:none;
    font-size:13.5px;
    padding:8px 0;
  }
  .pd-comment-submit{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--blue);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    padding:6px 4px;
  }
  .pd-comment-submit:disabled{
    color:#b2dffc;
    cursor:default;
  }

  /* story viewer */
  #storyViewerScreen{
    background:#000;
  }
  .story-progress-row{
    display:flex;
    gap:4px;
    padding:8px 10px 0 10px;
  }
  .story-progress-row .bar{
    flex:1;
    height:2.5px;
    background:rgba(255,255,255,.35);
    border-radius:2px;
    overflow:hidden;
  }
  .story-progress-row .bar i{
    display:block;
    height:100%;
    width:0%;
    background:#fff;
  }
  .story-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    color:#fff;
  }
  .story-header img{
    width:30px; height:30px;
    border-radius:50%;
    object-fit:cover;
  }
  .story-header .u{ font-size:13px; font-weight:600; }
  .story-header .x{ margin-left:auto; }
  .story-stage{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .story-stage img{
    max-width:100%;
    max-height:100%;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .story-tap-zone{
    position:absolute;
    top:0; bottom:0;
    width:50%;
  }
  .story-tap-zone.left{ left:0; }
  .story-tap-zone.right{ right:0; }

  svg{ display:block; }

  /* ---- 하단바 (DM) ---- */
  .bottombar{
    height:52px;
    min-height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16px;
    border-top:1px solid var(--border);
    background:#fff;
  }
  .bottombar .icon-btn{
    padding:6px;
    position:relative;
  }
  .dm-dot{
    position:absolute;
    top:4px; right:4px;
    width:9px; height:9px;
    border-radius:50%;
    background:#ed4956;
    border:1.5px solid #fff;
    display:none;
  }
  .dm-dot.show{ display:block; }

  /* ---- DM 화면 ---- */
  .dm-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 6px;
  }
  .dm-header img{
    width:32px; height:32px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
  }
  .dm-header .dm-header-info{
    display:flex;
    flex-direction:column;
    line-height:1.25;
  }
  .dm-header .dm-header-name{
    font-size:14px;
    font-weight:600;
  }
  .dm-header .dm-header-status{
    font-size:11.5px;
    color:var(--gray-text);
  }
  .dm-body{
    flex:1;
    overflow-y:auto;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
    background:#fff;
  }
  .dm-date-sep{
    text-align:center;
    font-size:11.5px;
    color:var(--gray-text);
    margin:14px 0 10px 0;
  }
  .dm-date-sep:first-child{ margin-top:2px; }
  .dm-row{
    display:flex;
    justify-content:flex-start;
    align-items:flex-end;
    gap:6px;
    margin-top:2px;
  }
  .dm-row.mine{
    justify-content:flex-end;
  }
  .dm-row .dm-avatar{
    width:22px; height:22px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
    flex-shrink:0;
  }
  .dm-bubble{
    max-width:70%;
    background:var(--border);
    color:#111;
    font-size:13.5px;
    line-height:1.4;
    padding:9px 13px;
    border-radius:20px;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .dm-bubble.mine{
    background:var(--blue);
    color:#fff;
  }
  .dm-time{
    text-align:left;
    font-size:10.5px;
    color:var(--gray-text);
    margin:3px 0 8px 30px;
  }
  .dm-time.mine{
    text-align:right;
    margin:3px 0 8px 0;
  }
  .dm-empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--gray-text);
    text-align:center;
    padding:0 30px;
  }
  .dm-empty .dm-empty-avatar{
    width:80px; height:80px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
  }
  .dm-empty .dm-empty-name{
    font-size:15px;
    font-weight:700;
    color:#111;
  }
  .dm-inputbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-top:1px solid var(--border);
  }
  .dm-input{
    flex:1;
    border:1px solid var(--border);
    border-radius:20px;
    padding:9px 15px;
    font-size:13.5px;
    outline:none;
  }
  .dm-send-btn{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--blue);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    padding:6px 4px;
  }
  .dm-send-btn:disabled{
    color:#b2dffc;
    cursor:default;
  }
</style>
</head>
<body>

<div class="phone">

  <!-- ============ FEED / PROFILE SCREEN ============ -->
  <div class="screen" id="feedScreen">
    <div class="topbar">
      <div class="username" id="topUsername">
        yourname
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <button class="icon-btn" title="메뉴">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <div class="profile-wrap">
      <div class="profile-top">
        <div class="avatar-ring" id="avatarRing">
          <img class="avatar" id="profAvatar" src="https://picsum.photos/seed/myavatar/200/200" alt="avatar">
        </div>
        <div class="stats">
          <div class="stat"><b id="statPosts">9</b><span>게시물</span></div>
          <div class="stat"><b>1</b><span>팔로워</span></div>
          <div class="stat"><b>1</b><span>팔로우</span></div>
        </div>
      </div>
      <div class="name-bio">
        <div class="fullname" id="profFullname">홍길동</div>
        <div class="bio" id="profBio">📸 일상을 기록합니다
✈️ 여행 좋아함</div>
      </div>
    </div>

    <div class="tabbar">
      <button class="active" data-tab="posts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button data-tab="video">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button data-tab="tagged">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </button>
    </div>

    <div class="grid" id="postGrid"></div>

    <div class="bottombar">
      <button class="icon-btn" id="dmOpenBtn" title="메시지">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
        <span class="dm-dot" id="dmDot"></span>
      </button>
    </div>
  </div>

  <!-- ============ DM SUBSCREEN ============ -->
  <div class="subscreen" id="dmScreen">
    <div class="topbar">
      <button class="icon-btn" data-close="dmScreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="dm-header">
        <img id="dmHeaderAvatar" src="" alt="">
        <div class="dm-header-info">
          <div class="dm-header-name" id="dmHeaderName"></div>
          <div class="dm-header-status" id="dmHeaderStatus"></div>
        </div>
      </div>
      <div style="width:24px"></div>
    </div>
    <div class="dm-body" id="dmBody"></div>
    <form class="dm-inputbar" id="dmForm">
      <input type="text" id="dmInput" class="dm-input" placeholder="메시지 보내기..." maxlength="500" autocomplete="off" required>
      <button type="submit" class="dm-send-btn">전송</button>
    </form>
  </div>

  <!-- ============ POST DETAIL SUBSCREEN ============ -->
  <div class="subscreen" id="postDetailScreen">
    <div class="topbar">
      <button class="icon-btn" data-close="postDetailScreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title">게시물</div>
      <div style="width:24px"></div>
    </div>
    <div class="post-detail-body">
      <div class="pd-header">
        <img id="pdAvatar" src="https://picsum.photos/seed/myavatar/200/200">
        <div class="u" id="pdUsername">yourname</div>
      </div>
      <div class="pd-media" id="pdMedia"></div>
      <div class="pd-actions">
        <svg id="pdLikeBtn" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V6a3 3 0 0 1 3-3h11a4 4 0 0 1 4 4z"/></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      </div>
      <div class="pd-likes" id="pdLikes">좋아요 <span id="pdLikesCount">128</span>개</div>
      <div class="pd-caption"><b id="pdCaptionUser">yourname</b><span id="pdCaptionText"></span></div>
      <div class="pd-comments-header">댓글 <span id="pdCommentCount">0</span>개</div>
      <div class="pd-comments" id="pdComments"></div>
    </div>
    <form class="pd-comment-bar" id="pdCommentForm">
      <input type="text" id="pdCommentName" class="pd-comment-name-input" placeholder="닉네임" maxlength="20">
      <input type="text" id="pdCommentText" class="pd-comment-text-input" placeholder="댓글 달기..." maxlength="300" required>
      <button type="submit" class="pd-comment-submit">게시</button>
    </form>
  </div>

  <!-- ============ 내 스토리 뷰어 SUBSCREEN ============ -->
  <div class="subscreen" id="storyViewerScreen">
    <div class="story-progress-row" id="storyProgressRow"></div>
    <div class="story-header">
      <img id="storyHeaderAvatar" src="">
      <div class="u" id="storyHeaderUsername"></div>
      <button class="icon-btn x" data-close="storyViewerScreen" style="color:#fff;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="story-stage" id="storyStage">
      <div class="story-tap-zone left" id="storyTapLeft"></div>
      <div class="story-tap-zone right" id="storyTapRight"></div>
    </div>
  </div>

</div>

<script>

     이 파일은 업로드 버튼 없이, 아래 데이터를 직접 수정해서 내용을

  function escapeHtml(str){

  // ---------- helpers ----------
  function extractYoutubeId(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

    document.getElementById('profBio').textContent = profile.bio;

    updateAvatarRing();
  }

  // ---------- 탭 전환 ----------

  function currentList(){
    if(currentTab === 'video') return youtubePosts;

    return posts;

  document.querySelectorAll('.tabbar button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderGrid();
    });
  });

  function renderGrid(){
    const grid = document.getElementById('postGrid');
    grid.innerHTML = "";
    const list = currentList();

    if(currentTab === 'video'){
      // 두 번째 탭: 유튜브 영상 비율(16:9)에 맞춘 세로 리스트
      grid.classList.add('video-mode');
      if(list.length === 0){
        grid.innerHTML = `<div class="cell empty" style="aspect-ratio:16/9;"></div>`;
        return;
      }
      list.forEach((p, i)=>{
        const wrap = document.createElement('div');
        wrap.className = "cell-wrap";
        const ytId = extractYoutubeId(p.src);
        const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : "";
        wrap.innerHTML = `
          <div class="cell">
            <img src="${thumb}" alt="youtube">
            <svg class="yt-badge" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        `;
        wrap.addEventListener('click', ()=> openPostDetail(i));
        grid.appendChild(wrap);
      });
      return;
    }

    // 첫 번째 / 세 번째 탭: 기존 3x3 정사각형 그리드
    grid.classList.remove('video-mode');
    const shown = list.slice(0,9);
    for(let i=0;i<9;i++){
      const cell = document.createElement('div');
      const p = shown[i];
      if(p){
        cell.className = "cell";
        if(p.type === "youtube"){
          const ytId = extractYoutubeId(p.src);
          const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : "";
          cell.innerHTML = `<img src="${thumb}" alt="youtube"><svg class="yt-badge" width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>`;
        } else {
          const isMulti = Array.isArray(p.src);
          const thumbSrc = isMulti ? p.src[0] : p.src;
          const multiBadge = isMulti
            ? `<svg class="multi-badge" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M3 17V5a2 2 0 0 1 2-2h12"/></svg>`
            : "";
          cell.innerHTML = `<img src="${thumbSrc}" alt="post">${multiBadge}`;
        }
        cell.addEventListener('click', ()=> openPostDetail(i));
      } else {
        cell.className = "cell empty";
      }
      grid.appendChild(cell);
    }
  }

  // ---------- post detail ----------
  function openPostDetail(i){
    const p = currentList()[i];
    document.getElementById('pdAvatar').src = profile.avatar;
    document.getElementById('pdUsername').textContent = profile.username;
    document.getElementById('pdCaptionUser').textContent = profile.username;
    document.getElementById('pdCaptionText').textContent = " " + (p.caption || "");
    document.getElementById('pdLikeBtn').classList.remove('liked'); // 게시물 열 때마다 하트는 초기 상태로
    const media = document.getElementById('pdMedia');
    if(p.type === "youtube"){
      media.classList.add('video-ratio'); // 유튜브 영상은 16:9 비율로 노출
      const ytId = extractYoutubeId(p.src);
      media.innerHTML = ytId
        ? `<iframe src="https://www.youtube.com/embed/${ytId}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
        : `<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;">유효하지 않은 유튜브 링크</div>`;
    } else {
      media.classList.remove('video-ratio'); // 사진은 기존처럼 정사각형
      const images = Array.isArray(p.src) ? p.src : [p.src];
      if(images.length > 1){
        // 사진이 여러 장이면 옆으로 넘겨볼 수 있는 슬라이드로 표시
        const imgsHtml = images.map(src => `<img src="${src}" alt="post">`).join("");
        const dotsHtml = images.map((_, idx) => `<span class="${idx === 0 ? 'active' : ''}"></span>`).join("");
        media.innerHTML = `
          <div class="pd-swipe-counter">1/${images.length}</div>
          <div class="pd-swipe-track" id="pdSwipeTrack">${imgsHtml}</div>
          <div class="pd-swipe-dots" id="pdSwipeDots">${dotsHtml}</div>
        `;
        const track = document.getElementById('pdSwipeTrack');
        const dots = document.querySelectorAll('#pdSwipeDots span');
        const counter = media.querySelector('.pd-swipe-counter');
        track.addEventListener('scroll', ()=>{
          const idx = Math.round(track.scrollLeft / track.clientWidth);
          dots.forEach((d, i)=> d.classList.toggle('active', i === idx));
          counter.textContent = `${idx + 1}/${images.length}`;
        });
      } else {
        media.innerHTML = `<img src="${images[0]}" alt="post">`;
      }
    }
    currentPostKey = currentTab + '_' + i;
    document.getElementById('pdLikesCount').textContent = (typeof p.likes === 'number') ? p.likes : 128;
    renderComments();
    openScreen('postDetailScreen');
  }

  // ---------- 댓글 ----------
  let currentPostKey = null;

  function renderComments(){
    const list = allComments[currentPostKey] || [];
    const wrap = document.getElementById('pdComments');
    document.getElementById('pdCommentCount').textContent = list.length;

    if(list.length === 0){
      wrap.innerHTML = `<div class="pd-comment-empty">아직 댓글이 없습니다. 첫 댓글을 남겨보세요.</div>`;
      return;
    }

    wrap.innerHTML = list.map((c, idx) => `
      <div class="pd-comment">
        <span class="pd-comment-text"><b>${escapeHtml(c.name)}</b>${escapeHtml(c.text)}</span>
        <button class="pd-comment-del" data-idx="${idx}">삭제</button>
      </div>
    `).join('');

    wrap.querySelectorAll('.pd-comment-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        const pw = prompt('댓글을 삭제하려면 비밀번호를 입력하세요.');
        if(pw === null) return;
        if(pw === commentPassword){
          const list = allComments[currentPostKey] || [];
          list.splice(idx, 1);
          allComments[currentPostKey] = list;
          saveComments();
          renderComments();
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      });
    });
  }

  document.getElementById('pdCommentForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(!currentPostKey) return;
    const nameInput = document.getElementById('pdCommentName');
    const textInput = document.getElementById('pdCommentText');
    const name = nameInput.value.trim() || '익명';
    const text = textInput.value.trim();
    if(!text) return;

    if(!allComments[currentPostKey]) allComments[currentPostKey] = [];
    allComments[currentPostKey].push({name, text});
    saveComments();

    textInput.value = '';
    renderComments();
  });

  function openScreen(id){
    document.getElementById(id).classList.add('open');
  }
  function closeScreen(id){
    document.getElementById(id).classList.remove('open');
  }

  // ---------- 디엠(DM) ----------
  try{
    const saved = JSON.parse(localStorage.getItem('igCloneDmMessages') || 'null');
    if(Array.isArray(saved)) dmMessages = saved;
  }catch(e){}

  dmMessages.forEach(m=>{ if(!m.time) m.time = Date.now(); });

  function saveDmMessages(){
    try{ localStorage.setItem('igCloneDmMessages', JSON.stringify(dmMessages)); }catch(e){}
  }

  function formatDmDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
  }
  function formatDmTime(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit'});
  }

  function renderDm(){
    document.getElementById('dmHeaderAvatar').src = dmContact.avatar;
    document.getElementById('dmHeaderName').textContent = dmContact.name;
    document.getElementById('dmHeaderStatus').textContent = dmContact.status || '';

    const body = document.getElementById('dmBody');

    if(dmMessages.length === 0){
      body.innerHTML = `
        <div class="dm-empty">
          <img class="dm-empty-avatar" src="${dmContact.avatar}" alt="">
          <div class="dm-empty-name">${escapeHtml(dmContact.name)}</div>
          <div>메시지를 보내보세요.</div>
        </div>
      `;
      return;
    }

    let html = "";
    let lastDateLabel = null;
    dmMessages.forEach(m=>{
      const dateLabel = formatDmDate(m.time);
      if(dateLabel !== lastDateLabel){
        html += `<div class="dm-date-sep">${dateLabel} ${formatDmTime(m.time)}</div>`;
        lastDateLabel = dateLabel;
      }
      if(m.mine){
        // juhoon이 보낸 메시지 -> 오른쪽, 파란 말풍선, 프로필 사진 없음
        html += `
          <div class="dm-row mine"><div class="dm-bubble mine">${escapeHtml(m.text)}</div></div>
          <div class="dm-time mine">${formatDmTime(m.time)}</div>
        `;
      } else {
        // eom(메인 프로필)이 보낸 메시지 -> 왼쪽, 회색 말풍선, 프로필 사진
        html += `
          <div class="dm-row"><img class="dm-avatar" src="${dmContact.avatar}" alt=""><div class="dm-bubble">${escapeHtml(m.text)}</div></div>
          <div class="dm-time">${formatDmTime(m.time)}</div>
        `;
      }
    });
    body.innerHTML = html;
    body.scrollTop = body.scrollHeight;
  }

  document.getElementById('dmOpenBtn').addEventListener('click', ()=>{
    document.getElementById('dmDot').classList.remove('show');
    renderDm();
    openScreen('dmScreen');
    setTimeout(()=>{
      const body = document.getElementById('dmBody');
      body.scrollTop = body.scrollHeight;
    }, 50);
  });

  document.getElementById('dmForm').addEventListener('submit', function(e){
    e.preventDefault();
    const input = document.getElementById('dmInput');
    const text = input.value.trim();
    if(!text) return;
    dmMessages.push({text, time: Date.now(), mine: true});
    saveDmMessages();
    input.value = '';
    renderDm();
  });

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=> {
      closeScreen(btn.dataset.close);
      if(btn.dataset.close === 'storyViewerScreen') stopStoryTimer();
    });
  });

  // ---------- 내 스토리 ----------
  let storyTimer = null;
  let currentStoryIndex = 0;
  const STORY_DURATION = 4000;

  const myStoryFileInput = document.createElement('input');
  myStoryFileInput.type = "file";
  myStoryFileInput.accept = "image/*";
  myStoryFileInput.multiple = true; // 한 번에 여러 장 선택해서 올릴 수 있음
  myStoryFileInput.style.display = "none";
  document.body.appendChild(myStoryFileInput);
  myStoryFileInput.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    let loaded = 0;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        myStories.push({media: reader.result}); // 기존 스토리 뒤에 순서대로 추가
        loaded++;
        if(loaded === files.length) updateAvatarRing();
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('avatarRing').addEventListener('click', ()=>{
    if(myStories.length > 0){
      openStoryViewer(0);
    } else {
      myStoryFileInput.click();
    }
  });

  function openStoryViewer(startIndex){
    currentStoryIndex = startIndex;
    document.getElementById('storyHeaderAvatar').src = profile.avatar;
    document.getElementById('storyHeaderUsername').textContent = profile.username;

    // 스토리 개수만큼 프로그레스 바를 만들어줌
    const row = document.getElementById('storyProgressRow');
    row.innerHTML = myStories.map(()=> `<div class="bar"><i></i></div>`).join("");

    openScreen('storyViewerScreen');
    showStory(currentStoryIndex);
  }

  function showStory(index){
    const stage = document.getElementById('storyStage');
    stage.querySelectorAll('img').forEach(el=>el.remove());
    const img = document.createElement('img');
    img.src = myStories[index].media;
    stage.insertBefore(img, stage.firstChild);

    const bars = document.querySelectorAll('#storyProgressRow .bar i');
    bars.forEach((bar, i)=>{
      bar.style.transition = "none";
      bar.style.width = i < index ? "100%" : "0%"; // 이미 지난 스토리는 꽉 채워둠
    });

    const bar = bars[index];
    void bar.offsetWidth;
    bar.style.transition = `width ${STORY_DURATION}ms linear`;
    requestAnimationFrame(()=>{ bar.style.width = "100%"; });

    stopStoryTimer();
    storyTimer = setTimeout(()=> nextStory(), STORY_DURATION);
  }

  function nextStory(){
    if(currentStoryIndex < myStories.length - 1){
      currentStoryIndex++;
      showStory(currentStoryIndex);
    } else {
      stopStoryTimer();
      closeScreen('storyViewerScreen');
    }
  }

  function prevStory(){
    if(currentStoryIndex > 0){
      currentStoryIndex--;
      showStory(currentStoryIndex);
    } else {
      showStory(currentStoryIndex); // 첫 스토리면 처음부터 다시 재생
    }
  }

  function stopStoryTimer(){
    if(storyTimer){ clearTimeout(storyTimer); storyTimer = null; }
  }

  document.getElementById('storyTapLeft').addEventListener('click', ()=> prevStory());
  document.getElementById('storyTapRight').addEventListener('click', ()=> nextStory());

  // ---------- 좋아요(하트) ----------
  document.getElementById('pdLikeBtn').addEventListener('click', function(){
    this.classList.toggle('liked');
  });

  // ---------- init ----------
  renderProfile();
  renderGrid();
</script>
</body>
</html>
